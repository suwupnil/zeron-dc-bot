# ==============================================================================
# Apache Reverse Proxy Configuration for Magpie (Port 4001)
# 
# Automatically injects Magpie session authentication headers so requests
# accessing port 4001 are pre-authenticated and never prompt for login keys.
# ==============================================================================

Listen 4001
<VirtualHost *:4001>
    # Replace <YOUR_MAGPIE_SESSION_COOKIE> with your actual cookie e.g. magpie_web_4000=<KEY>
    RequestHeader set Cookie "<YOUR_MAGPIE_SESSION_COOKIE>"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/
</VirtualHost>
