name: "✨ Feature Request"
description: Suggest an idea or enhancement for zeron-dc-bot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or improvement for zeron-dc-bot!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear and concise description of what you want to happen and how it should work.
      placeholder: Describe the proposed enhancement or behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions, designs, or workarounds you have considered.
      placeholder: Briefly outline any alternatives considered...
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Relevant Area
      description: Which area does this feature relate to?
      options:
        - "Slash Commands & Interactions"
        - "Discord Gateway / Threads / Side Chats"
        - "Zeron MCP Integration & Agent Harnesses"
        - "Decision Model / Filtering"
        - "Configuration & Session Management"
        - "Developer Experience & Tooling"
        - "Other"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, mockups, or API references here.
      placeholder: Any additional context...
    validations:
      required: false
