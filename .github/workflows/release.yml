name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN_NAME="zeron-dc-bot"
          REF_NAME="${{ github.ref_name || 'latest' }}"
          ARCHIVE_VERSIONED="zeron-dc-bot-${REF_NAME}-${{ matrix.target }}.tar.gz"
          ARCHIVE_GENERIC="zeron-dc-bot-${{ matrix.target }}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          chmod +x "${BIN_NAME}"
          tar -czvf "${ARCHIVE_VERSIONED}" "${BIN_NAME}"
          cp "${ARCHIVE_VERSIONED}" "${ARCHIVE_GENERIC}"
          shasum -a 256 "${ARCHIVE_VERSIONED}" > "${ARCHIVE_VERSIONED}.sha256"
          shasum -a 256 "${ARCHIVE_GENERIC}" > "${ARCHIVE_GENERIC}.sha256"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${ARCHIVE_VERSIONED}" "${ARCHIVE_VERSIONED}.sha256" "${ARCHIVE_GENERIC}" "${ARCHIVE_GENERIC}.sha256" "$GITHUB_WORKSPACE/dist/"

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BIN_NAME="zeron-dc-bot.exe"
          REF_NAME="${{ github.ref_name || 'latest' }}"
          ARCHIVE_VERSIONED="zeron-dc-bot-${REF_NAME}-${{ matrix.target }}.zip"
          ARCHIVE_GENERIC="zeron-dc-bot-${{ matrix.target }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "${ARCHIVE_VERSIONED}" "${BIN_NAME}"
          cp "${ARCHIVE_VERSIONED}" "${ARCHIVE_GENERIC}"
          shasum -a 256 "${ARCHIVE_VERSIONED}" > "${ARCHIVE_VERSIONED}.sha256" || certutil -hashfile "${ARCHIVE_VERSIONED}" SHA256 > "${ARCHIVE_VERSIONED}.sha256"
          shasum -a 256 "${ARCHIVE_GENERIC}" > "${ARCHIVE_GENERIC}.sha256" || certutil -hashfile "${ARCHIVE_GENERIC}" SHA256 > "${ARCHIVE_GENERIC}.sha256"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "${ARCHIVE_VERSIONED}" "${ARCHIVE_VERSIONED}.sha256" "${ARCHIVE_GENERIC}" "${ARCHIVE_GENERIC}.sha256" "$GITHUB_WORKSPACE/dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Display release assets
        run: |
          ls -la release-assets/

      - name: Compute Release Metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Latest Prebuilt Release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
